<!-- Identidad visual Kairos aplicada acá -- paleta/tipografía tomadas de
     sistema-control-jornada/frontend/src/styles/tokens.css (proyecto hermano), sin copiar
     componentes React: este servicio es HTML/CSS plano sin build (corre en una Raspberry Pi sin
     Node). CSS propio en static/estilos.css, Google Fonts vía <link> porque no hay bundler. -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kairos · Checador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
  <div class="pantalla-kiosco">
    <header class="cabecera-kiosco">
      <span class="wordmark-kiosco">Kairos</span>
      <span class="subtitulo-kiosco">Checador</span>
    </header>

    <main class="contenido-kiosco">
      {% block contenido %}{% endblock %}
    </main>

    <nav class="tabs-kiosco">
      <a href="/marcar" class="tab-kiosco {{ 'tab-kiosco--activa' if request.url.path == '/marcar' else '' }}">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Marcar</span>
      </a>
      <a href="/historial" class="tab-kiosco {{ 'tab-kiosco--activa' if request.url.path == '/historial' else '' }}">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>Historial</span>
      </a>
      <a href="/config" class="tab-kiosco {{ 'tab-kiosco--activa' if request.url.path == '/config' else '' }}">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.02a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.02a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Config</span>
      </a>
    </nav>
  </div>
</body>
</html>
